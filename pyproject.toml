[project]
name = "sextante"
version = "0.1.0.dev0"
description = "Mechanistic interpretability for vision-language models, in pure PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "José Manuel Haces", email = "jmanuelhaces@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["interpretability", "sparse-autoencoders", "vision-language-models", "pytorch", "medical-imaging"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.50",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU and real model weights (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]
